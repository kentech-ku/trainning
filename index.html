<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a70"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="筋トレログ"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><title>トレーニングログ</title><style>
:root{--navy:#102a70;--blue:#2563eb;--bg:#f3f6fb;--card:#fff;--ink:#111827;--muted:#64748b;--line:#dbe2ea;--green:#059669;--red:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;padding-bottom:env(safe-area-inset-bottom)}button,input,select,textarea{font:inherit}.app{max-width:1100px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 12px 24px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 3px 15px #0f172a12}h1{font-size:23px;margin:0}h2{font-size:18px;margin:0 0 12px}.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#eef2f7;padding:5px;border-radius:13px;margin:12px 0}.tab{border:0;padding:10px;border-radius:9px;background:transparent;font-weight:700}.tab.on{background:var(--navy);color:#fff}.view{display:none}.view.on{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.wide{grid-column:span 2}label{font-size:12px;font-weight:700;color:var(--muted)}input,select,textarea{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:11px}textarea{min-height:75px;resize:vertical}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.stat b{font-size:19px;display:block}.stat small,.note{color:var(--muted);font-size:12px}.exercise{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.exhead{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;align-items:end}.sets{display:grid;grid-template-columns:repeat(5,minmax(115px,1fr));gap:7px;overflow-x:auto;padding:8px 0}.set{min-width:115px;background:#f8fafc;border-radius:10px;padding:7px}.set strong{font-size:11px}.pair{display:grid;grid-template-columns:1fr 15px 1fr;align-items:center}.pair input,.pair select{padding:8px 3px;text-align:center}.btns{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:#e5e7eb}.danger{background:#fee2e2;color:var(--red)}.status{color:var(--green);font-size:12px;min-height:18px}.history{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}.chartbox{height:250px;position:relative}.chartbox svg{width:100%;height:100%;overflow:visible}.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.big{font-size:30px;color:var(--navy);font-weight:800}.empty{text-align:center;color:var(--muted);padding:28px}.install{display:none;background:#dbeafe;color:#1e3a8a;border-radius:10px;padding:9px;font-size:12px;margin-top:8px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}.stats{grid-template-columns:1fr 1fr}.exhead{grid-template-columns:1fr auto}.exhead .custom{grid-column:1/-1}.sets{grid-template-columns:repeat(5,122px)}.filters{grid-template-columns:1fr}.card{padding:13px}}
</style></head><body><div class="app"><div class="top"><h1>🏋️ トレーニングログ</h1><span id="online" class="note"></span></div><div id="installNote" class="install">Safariの共有ボタンから「ホーム画面に追加」すると、アプリのように利用できます。</div><nav class="tabs"><button class="tab on" data-tab="input">記録</button><button class="tab" data-tab="history">履歴</button><button class="tab" data-tab="analysis">分析</button></nav>
<section id="input" class="view on"><div class="card"><h2>基本情報</h2><div class="grid"><label>日付<input id="date" type="date"></label><label>開始時間<input id="start" type="time"></label><label>終了時間<input id="end" type="time"></label><label class="wide">場所<input id="place" placeholder="例：自宅、〇〇ジム"></label><label>メイン部位<select id="mainPart"></select></label><label>サブ部位<select id="subPart"></select></label></div></div><div class="card"><h2>本日の集計</h2><div class="stats"><div class="stat"><b id="nEx">0</b><small>種目</small></div><div class="stat"><b id="nSet">0</b><small>セット</small></div><div class="stat"><b id="todayVol">0 kg</b><small>総挙上重量</small></div><div class="stat"><b id="duration">-</b><small>所要時間</small></div></div></div><div class="card"><h2>種目・セット</h2><div id="exerciseList"></div><button id="addEx" class="btn secondary">＋ 種目追加</button><p class="note">登録種目は選択式です。「その他（自由入力）」を選ぶと独自の種目名を保存できます。</p></div><div class="card"><h2>全体メモ</h2><textarea id="memo" placeholder="体調、フォーム、次回目標など"></textarea></div><div class="card"><div class="btns"><button id="save" class="btn primary">履歴に保存</button><button id="new" class="btn secondary">新しい記録</button><button id="clear" class="btn danger">入力を消去</button></div><div id="status" class="status"></div><p class="note">入力中データは端末内に自動保存されます。</p></div></section>
<section id="history" class="view"><div class="card"><div class="top"><h2>保存履歴</h2><div class="btns"><button id="export" class="btn secondary">バックアップ出力</button><label class="btn secondary" style="color:#111827">読込<input id="import" type="file" accept="application/json" hidden></label></div></div><div id="historyList"></div></div></section>
<section id="analysis" class="view"><div class="card"><h2>分析条件</h2><div class="filters"><label>対象月<input id="month" type="month"></label><label>重量推移の種目<select id="analysisExercise"></select></label></div></div><div class="card"><h2>月間総挙上重量</h2><div id="monthlyVolume" class="big">0 kg</div><p id="monthlySessions" class="note"></p></div><div class="card"><h2>部位別実施回数</h2><div id="partChart" class="chartbox"></div></div><div class="card"><h2>ベンチプレス重量推移</h2><div id="benchChart" class="chartbox"></div></div><div class="card"><h2>選択種目の重量推移</h2><div id="exerciseChart" class="chartbox"></div></div></section></div>
<script>
const PARTS=['','胸','肩','背中','脚','腕','腹部','有酸素','全身','その他'];
const MASTER=['ベンチプレス','インクラインベンチプレス','ダンベルベンチプレス','チェストプレス','ペックフライ','ディップス','ミリタリープレス','ダンベルショルダープレス','サイドレイズ','リアレイズ','ラットプルダウン','懸垂','ベントオーバーロウ','シーテッドロウ','デッドリフト','スクワット','レッグプレス','レッグエクステンション','レッグカール','アームカール','トライセプスプレスダウン','その他（自由入力）'];
const DK='trainingLogDraftV2',HK='trainingLogHistoryV1';let exercises=[],editingId=null,timer;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?.()||Date.now()+'-'+Math.random();const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);const monthNow=()=>today().slice(0,7);const loadH=()=>{try{return JSON.parse(localStorage.getItem(HK)||'[]')}catch{return[]}};const blank=()=>({choice:'',custom:'',sets:Array.from({length:5},()=>({weight:'',reps:''})),rpe:'',memo:''});const nameOf=e=>e.choice==='その他（自由入力）'?e.custom.trim():e.choice;
function opts(a,v,blankText='選択'){return `<option value="">${blankText}</option>`+a.map(x=>`<option value="${esc(x)}" ${x===v?'selected':''}>${esc(x)}</option>`).join('')}
function init(){['mainPart','subPart'].forEach(id=>$(id).innerHTML=opts(PARTS.slice(1),'','選択'));$('month').value=monthNow();let d;try{d=JSON.parse(localStorage.getItem(DK)||'null')}catch{}setForm(d||{date:today(),exercises:[blank()]});events();renderHistory();refreshAnalysis();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');updateOnline();$('installNote').style.display=matchMedia('(display-mode: standalone)').matches?'none':'block'}
function renderExercises(){$('exerciseList').innerHTML=exercises.map((e,i)=>`<div class="exercise"><div class="exhead"><label>種目<select data-i="${i}" data-k="choice">${opts(MASTER,e.choice,'種目を選択')}</select></label><label class="custom" style="${e.choice==='その他（自由入力）'?'':'display:none'}">自由入力<input data-i="${i}" data-k="custom" value="${esc(e.custom)}" placeholder="種目名"></label><button class="btn danger" data-del="${i}">削除</button></div><div class="sets">${e.sets.map((s,j)=>`<div class="set"><strong>${j+1}セット</strong><div class="pair"><input data-i="${i}" data-j="${j}" data-k="weight" type="number" inputmode="decimal" min="0" step="0.5" value="${esc(s.weight)}" placeholder="kg"><span>×</span><select data-i="${i}" data-j="${j}" data-k="reps">${opts(Array.from({length:50},(_,k)=>String(k+1)),String(s.reps),'回')}</select></div></div>`).join('')}</div><div class="grid"><label>RPE<select data-i="${i}" data-k="rpe">${opts(['6','6.5','7','7.5','8','8.5','9','9.5','10'],String(e.rpe),'-')}</select></label><label class="wide">種目メモ<input data-i="${i}" data-k="memo" value="${esc(e.memo)}"></label></div></div>`).join('');stats()}
function data(){return{id:editingId||uid(),date:$('date').value,startTime:$('start').value,endTime:$('end').value,place:$('place').value,mainPart:$('mainPart').value,subPart:$('subPart').value,exercises,overallMemo:$('memo').value,updatedAt:new Date().toISOString()}}
function setForm(d){editingId=d.id||null;$('date').value=d.date||today();$('start').value=d.startTime||'';$('end').value=d.endTime||'';$('place').value=d.place||'';$('mainPart').value=d.mainPart||'';$('subPart').value=d.subPart||'';$('memo').value=d.overallMemo||'';exercises=d.exercises?.length?d.exercises.map(e=>({choice:e.choice||(MASTER.includes(e.name)?e.name:'その他（自由入力）'),custom:e.custom||(!MASTER.includes(e.name||'')?e.name||'':''),sets:e.sets||blank().sets,rpe:e.rpe||'',memo:e.memo||''})):[blank()];renderExercises()}
function changed(){stats();clearTimeout(timer);timer=setTimeout(()=>{localStorage.setItem(DK,JSON.stringify(data()));$('status').textContent='自動保存しました'},200)}
function stats(){let ne=0,ns=0,v=0;exercises.forEach(e=>{if(nameOf(e))ne++;e.sets.forEach(s=>{if(s.weight!==''&&s.reps!==''){ns++;v+=(+s.weight||0)*(+s.reps||0)}})});$('nEx').textContent=ne;$('nSet').textContent=ns;$('todayVol').textContent=v.toLocaleString()+' kg';let a=$('start').value,b=$('end').value;if(!a||!b)$('duration').textContent='-';else{let [h,m]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number),n=h2*60+m2-h*60-m;if(n<0)n+=1440;$('duration').textContent=(n>=60?Math.floor(n/60)+'時間':'')+n%60+'分'}}
function save(){let r=data();if(!r.date||!r.exercises.some(e=>nameOf(e))){alert('日付と種目を入力してください');return}let h=loadH(),i=h.findIndex(x=>x.id===r.id);i>=0?h[i]=r:h.unshift(r);h.sort((a,b)=>(b.date+(b.startTime||'')).localeCompare(a.date+(a.startTime||'')));localStorage.setItem(HK,JSON.stringify(h));localStorage.setItem(DK,JSON.stringify(r));editingId=r.id;$('status').textContent='履歴に保存しました';renderHistory();refreshAnalysis()}
function renderHistory(){let h=loadH();$('historyList').innerHTML=h.length?h.map(r=>`<div class="history"><div><b>${esc(r.date)} ${esc(r.mainPart||'')}${r.subPart?'・'+esc(r.subPart):''}</b><div class="note">${esc(r.place||'')}<br>${r.exercises.map(nameOf).filter(Boolean).map(esc).join('、')}</div></div><div class="btns"><button class="btn secondary" data-open="${r.id}">開く</button><button class="btn danger" data-rm="${r.id}">削除</button></div></div>`).join(''):'<div class="empty">保存履歴はありません</div>'}
function volume(r){return r.exercises.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.weight||0)*(+s.reps||0),0),0)}function maxWeight(r,name){let m=null;r.exercises.filter(e=>nameOf(e)===name).forEach(e=>e.sets.forEach(s=>{if(s.reps!==''&&s.weight!=='' )m=Math.max(m??0,+s.weight)}));return m}
function refreshAnalysis(){let h=loadH(),m=$('month').value||monthNow(),mh=h.filter(r=>r.date?.startsWith(m));$('monthlyVolume').textContent=mh.reduce((a,r)=>a+volume(r),0).toLocaleString()+' kg';$('monthlySessions').textContent=`${m.replace('-','年')}月：${mh.length}回`;let counts={};mh.forEach(r=>[r.mainPart,r.subPart].filter(Boolean).forEach(p=>counts[p]=(counts[p]||0)+1));barChart($('partChart'),counts);let names=[...new Set(h.flatMap(r=>r.exercises.map(nameOf)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));let current=$('analysisExercise').value;$('analysisExercise').innerHTML=opts(names,current||names[0],'種目を選択');if(!current&&names[0])$('analysisExercise').value=names[0];lineChart($('benchChart'),series(h,'ベンチプレス'),'kg');lineChart($('exerciseChart'),series(h,$('analysisExercise').value),'kg')}
function series(h,name){return h.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(r=>({x:r.date,y:maxWeight(r,name)})).filter(x=>x.y!==null)}
function barChart(el,obj){let a=Object.entries(obj);if(!a.length){el.innerHTML='<div class="empty">対象月のデータがありません</div>';return}let max=Math.max(...a.map(x=>x[1])),w=600,h=220,bw=Math.min(62,480/a.length);el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img">${a.map(([k,v],i)=>{let x=55+i*(500/a.length),bh=150*v/max,y=175-bh;return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="5" fill="#2563eb"/><text x="${x+bw/2}" y="${y-7}" text-anchor="middle" font-size="13">${v}</text><text x="${x+bw/2}" y="198" text-anchor="middle" font-size="12">${esc(k)}</text>`}).join('')}</svg>`}
function lineChart(el,a,unit){if(!a.length){el.innerHTML='<div class="empty">該当する記録がありません</div>';return}let w=600,h=230,p=42,min=Math.min(...a.map(x=>x.y)),max=Math.max(...a.map(x=>x.y));if(min===max){min=Math.max(0,min-5);max+=5}let pts=a.map((d,i)=>({date:d.x,value:d.y,px:p+(w-2*p)*(a.length===1?.5:i/(a.length-1)),py:h-p-(h-2*p)*(d.y-min)/(max-min)}));el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#cbd5e1"/><polyline points="${pts.map(q=>q.px+','+q.py).join(' ')}" fill="none" stroke="#102a70" stroke-width="4"/>${pts.map(q=>`<circle cx="${q.px}" cy="${q.py}" r="5" fill="#2563eb"/><text x="${q.px}" y="${q.py-10}" text-anchor="middle" font-size="12">${q.value}${unit}</text><text x="${q.px}" y="${h-12}" text-anchor="middle" font-size="10">${esc(q.date.slice(5).replace('-','/'))}</text>`).join('')}</svg>`}
function events(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.tab).classList.add('on');if(b.dataset.tab==='analysis')refreshAnalysis()});$('exerciseList').addEventListener('input',editEx);$('exerciseList').addEventListener('change',editEx);$('exerciseList').onclick=e=>{if(e.target.dataset.del!==undefined){exercises.splice(+e.target.dataset.del,1);if(!exercises.length)exercises=[blank()];renderExercises();changed()}};['date','start','end','place','mainPart','subPart','memo'].forEach(id=>{$(id).oninput=changed;$(id).onchange=changed});$('addEx').onclick=()=>{if(exercises.length>=20)return alert('最大20種目です');exercises.push(blank());renderExercises();changed()};$('save').onclick=save;$('new').onclick=()=>{if(confirm('新しい記録を開始しますか？')){editingId=null;setForm({date:today(),exercises:[blank()]});changed()}};$('clear').onclick=()=>{if(confirm('入力内容を消去しますか？')){localStorage.removeItem(DK);editingId=null;setForm({date:today(),exercises:[blank()]})}};$('historyList').onclick=e=>{let h=loadH();if(e.target.dataset.open){let r=h.find(x=>x.id===e.target.dataset.open);setForm(r);localStorage.setItem(DK,JSON.stringify(r));document.querySelector('[data-tab=input]').click();scrollTo(0,0)}if(e.target.dataset.rm&&confirm('この履歴を削除しますか？')){localStorage.setItem(HK,JSON.stringify(h.filter(x=>x.id!==e.target.dataset.rm)));renderHistory();refreshAnalysis()}};$('month').onchange=refreshAnalysis;$('analysisExercise').onchange=()=>lineChart($('exerciseChart'),series(loadH(),$('analysisExercise').value),'kg');$('export').onclick=backup;$('import').onchange=restore;addEventListener('online',updateOnline);addEventListener('offline',updateOnline)}
function editEx(e){let t=e.target,i=+t.dataset.i;if(Number.isNaN(i))return;if(t.dataset.j!==undefined)exercises[i].sets[+t.dataset.j][t.dataset.k]=t.value;else exercises[i][t.dataset.k]=t.value;if(t.dataset.k==='choice')renderExercises();changed()}
function backup(){let blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),history:loadH()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`training-log-${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result),h=Array.isArray(d)?d:d.history;if(!Array.isArray(h))throw 0;if(confirm(`${h.length}件の履歴を読み込み、現在の履歴を置き換えますか？`)){localStorage.setItem(HK,JSON.stringify(h));renderHistory();refreshAnalysis()}}catch{alert('読み込めないバックアップです')}};r.readAsText(f);e.target.value=''}function updateOnline(){$('online').textContent=navigator.onLine?'オンライン':'オフライン'}init();
</script></body></html>
